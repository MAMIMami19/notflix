name: Build Notflix Restyle 3.3

# Notflix restyle 3.3 (1.0.0-beta.4.1-restyle3.3, vc 1082, com.notflix.tv.custom):
# the home is a strict whitelist in the agreed order (hero, Continue
# watching, genre tiles, My List, the 5 theme pairs, the 21 genre rows in
# tiles order, airing last when non-empty) — unlisted addon rows (M3U,
# English HD, Récemment regardés, Calendrier) leave the home; duplicate
# (genre, type) rows merge; a pending row covers its genre (no synthetic
# twin); «لأنك شاهدت» never renders.
# Notflix restyle 3.2 (1.0.0-beta.4.1-restyle3.2, vc 1081, com.notflix.tv.custom):
# Live TV row removed from home; row type labels in app locale (retry of the
# 3.1 fix — the 3.1 fix was in the wrong place); catalog names in app locale
# (local mapping for the 5 known names); tab hero backdrops; synthetic rows
# for the 7 genres with no home row; fuller Movies/Series tabs; expanded
# cards in My Space; vertical search categories; no black flash on the
# expanded card; the simplified «الجديد» tab.
# Notflix restyle 3.1 (1.0.0-beta.4.1-restyle3.1, vc 1080, com.notflix.tv.custom):
# fix build for the restyle-3 on-device deficiencies — Discover fallback off
# the empty PikPak watchlist, strict genre filter, CW/My-list kept while
# filtered, UP-to-tiles focus fix, My Space CW title, app-locale row type
# labels, wider top-bar tabs.
# Notflix restyle 3 (1.0.0-beta.4.1-restyle3, vc 1079, com.notflix.tv.custom):
# a side-by-side custom build that installs ALONGSIDE upstream Notflix.
# - Genre strip: 21 unified semi-transparent grey landscape tiles below
#   Continue watching (Netflix placement); OK on a tile opens that genre's
#   dedicated browse screen, whose content is matched to the genre (TMDB
#   genres, title/synopsis words, origin country for anime, recency +
#   rating for new & worthy). All restyle strings follow the app language
#   (Arabic by default, French when French).
# - Profile circle in the top bar (fixed: renders whenever an active
#   profile exists); Netflix-style tab redesigns (home hero inset card,
#   movies/series tabs with hero + rows, My Space sections, search with
#   Arabic keyboard + quick categories, detail screen).
# - Netflix-style home: same-theme catalog rows from different addons merge
#   into one row, and stock theme rows get Netflix-style localized titles.
# - Hero scrim spans the full width (was a 75% band with a hard edge).
# - New package (com.notflix.tv.custom) + new signing key + label
#   "NotFlix Custom"; the appearance gate covers the new package id.
# Films-and-series-only: no live TV, no audio changes.
on:
  workflow_dispatch:
  push:
    branches: [notflix-restyle-1]

# Serialize runs: two concurrent full-release builds died together when the
# runner pool cancelled them (Matrix runs 43618067580/43618374036); queue instead.
concurrency:
  group: notflix-restyle-3-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Write local.properties (backend config + release signing)
        run: |
          echo "${{ secrets.NUVIO_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "NUVIO_SUPABASE_URL=${{ secrets.NUVIO_SUPABASE_URL }}"
            echo "NUVIO_SUPABASE_ANON_KEY=${{ secrets.NUVIO_SUPABASE_ANON_KEY }}"
            echo "NUVIO_SUPABASE_FALLBACK_URL=${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}"
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "NUVIO_RELEASE_STORE_PASSWORD=${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}"
            echo "NUVIO_RELEASE_KEY_ALIAS=${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}"
            echo "NUVIO_RELEASE_KEY_PASSWORD=${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}"
          } > local.properties

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build signed Full release APKs
        run: |
          chmod +x gradlew
          # lintVitalAnalyzeFullRelease is skipped: on the 7 GB GitHub
          # runner it forks a second JVM while the Gradle daemon holds its
          # heap. --max-workers=2 caps parallel Kotlin/native workers so
          # peak memory stays well under the runner's limit (same lesson as
          # the Matrix builds; gradle.properties pins the heap to 4g).
          ./gradlew :app:assembleFullRelease -x lintVitalAnalyzeFullRelease --max-workers=2 --stacktrace --console=plain

      - name: Upload release APKs to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Artifact storage quota is hit (500 MB; usage recalculates only
          # every 6-12 h), so the APKs go to a DRAFT release instead — drafts
          # are invisible to the in-app updater (unauthenticated API calls
          # never see them, and the tag is not a valid version anyway).
          # Delete the draft after the APKs are verified/downloaded.
          TAG="notflix-restyle3.3-draft-${{ github.run_number }}"
          gh release create "$TAG" \
            --draft \
            --title "Notflix Restyle 3.3 draft (CI run ${{ github.run_number }})" \
            --notes "CI-built Notflix Restyle 3.3 release APKs (1.0.0-beta.4.1-restyle3.3, vc 1082, com.notflix.tv.custom): strict home whitelist in the agreed order, unlisted addon rows removed from home, (genre, type) dedupe, pending-row genre coverage, airing last, «لأنك شاهدت» removed. Side-by-side with upstream Notflix. Draft only — do not publish without review." \
            app/build/outputs/apk/full/release/*.apk

      - name: Run restyle unit tests (3.2 + 3.3)
        run: |
          # After the release step, so a test failure never blocks the APK.
          # The upstream home suite is red at HEAD for pre-existing restyle
          # reasons (title mapping, genre strip) and was never updated, so
          # only the restyle's own test classes run here.
          ./gradlew :app:testFullDebugUnitTest \
            --tests "com.nuvio.tv.ui.screens.home.NotflixRestyle32Test" \
            --tests "com.nuvio.tv.ui.screens.home.NotflixRestyle33Test" \
            --max-workers=2 --console=plain
